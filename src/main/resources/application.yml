spring:
  main:
    web-application-type: none
    banner-mode: off
  output:
    ansi: 
      enabled: always


triptale:
  # Directory where settings.yml (data dir, git author, impressions patterns) is stored.
  # Blank = platform default (%APPDATA%/triptale on Windows, $HOME/.config/triptale on
  # macOS/Linux). Overridable via TRIPTALE_SETTINGS_DIR env var or -Dtriptale.settings-dir=.
  settings-dir: ""
  # Display name of the app, used in menus, dialogs and the window title. Not user-editable
  # at runtime — change here if the app is ever renamed.
  app-name: "TripTale"

logging:
  level:
    root: INFO
    net.timafe.triptale: DEBUG
    org.eclipse.jgit: WARN
  pattern:
    # %replace takes a regex: use the quoted home path set in TripTaleApplication.init(),
    # a raw Windows path (C:\Users\...) is an illegal regex and breaks logging init.
    console: "%d{HH:mm:ss} %-5level %logger{36} : %replace(%msg){'${triptale.home-regex}','~'}%n"
