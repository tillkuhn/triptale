spring:
  main:
    web-application-type: none
    banner-mode: off
  output:
    ansi: 
      enabled: always


triptale:
  # Directory where settings.yml (data dir, git author, impressions patterns) is stored.
  # Blank = platform default (%APPDATA%/triptale on Windows, $HOME/.config/triptale on
  # macOS/Linux). Overridable via TRIPTALE_SETTINGS_DIR env var or -Dtriptale.settings-dir=.
  settings-dir: ""

logging:
  level:
    root: INFO
    net.timafe.triptale: DEBUG
    org.eclipse.jgit: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} : %msg%n"
