<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: #faf6ee;
            color: #1a1a2e;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }
        h1, h2 {
            font-family: sans-serif;
        }
        hr {
            border: none;
            border-top: 1px solid #ccc;
            margin: 2rem 0;
        }
        /* Entry facts (todo 53): a ticket stub glued in under the title */
        div.facts {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 0.5rem 0 1.5rem;
            padding: 0.8rem 1.2rem;
            background: #fffdf7;
            border: 1px dashed #2fb8a3;
            border-radius: 6px;
            font-family: sans-serif;
            line-height: 1.35;
        }
        /* Punched notches on both ends */
        div.facts::before, div.facts::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 18px;
            height: 18px;
            margin-top: -9px;
            border-radius: 50%;
            background: #faf6ee;
            border: 1px dashed #2fb8a3;
        }
        div.facts::before { left: -10px; clip-path: inset(0 0 0 50%); }
        div.facts::after { right: -10px; clip-path: inset(0 50% 0 0); }
        div.fact {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Top, not centred: stamp and emojis are equally tall, so icons and values line up across columns */
            justify-content: flex-start;
            text-align: center;
            padding: 0 0.9rem;
        }
        /* Perforation between the items */
        div.fact + div.fact {
            border-left: 2px dotted #2fb8a3;
        }
        /* As tall as the day stamp, so the three columns line up */
        .fact-emoji {
            height: 2.8rem;
            margin-bottom: 0.2rem;
            font-size: 2.4rem;
            line-height: 2.8rem;
        }
        .fact-stamp {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 2.8rem;
            height: 2.8rem;
            margin-bottom: 0.2rem;
            border: 2px solid #2fb8a3;
            border-radius: 50%;
            color: #1f8a7a;
            font-weight: bold;
            font-size: 1.1rem;
            line-height: 1;
            transform: rotate(-8deg);
        }
        .fact-stamp small {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .fact-value {
            font-weight: bold;
        }
        .fact-note {
            font-size: 0.85rem;
            color: #6b7b78;
        }
        /* Coordinates behind place names (todo 58) */
        .fact-detail {
            font-size: 0.72rem;
            color: #8a9693;
        }
        @media (max-width: 520px) {
            div.facts { flex-direction: column; }
            div.fact { padding: 0.5rem 0; }
            div.fact + div.fact { border-left: none; border-top: 2px dotted #2fb8a3; }
        }
        /* OpenStreetMap credit at the end (todo 58) */
        p.credits {
            margin-top: 2.5rem;
            padding-top: 0.6rem;
            border-top: 1px solid #ccc;
            font-family: sans-serif;
            font-size: 0.6rem;
            color: #8a9693;
        }
        p.credits a {
            color: inherit;
        }
        div.impressions {
            column-gap: 8px;
            margin: 1rem 0;
        }
        div.impressions img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 0 8px;
            border-radius: 4px;
            break-inside: avoid;
        }
    </style>
</head>
<body>
{{body}}
</body>
</html>
