<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <!-- A rough stand-in for the blog theme: the real look comes from WordPress -->
    <style>
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: #fff;
            color: #1a1a2e;
            max-width: 760px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }
        h2, h3, h4 {
            font-family: sans-serif;
        }
        .wp-block-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 1rem 0;
        }
        .wp-block-gallery.columns-1 { grid-template-columns: 1fr; }
        .wp-block-gallery.columns-3 { grid-template-columns: repeat(3, 1fr); }
        .wp-block-gallery.columns-4 { grid-template-columns: repeat(4, 1fr); }
        .wp-block-gallery figure {
            margin: 0;
        }
        .wp-block-gallery img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }
        .wp-block-quote {
            border-left: 4px solid #ccc;
            margin: 1rem 0;
            padding-left: 1rem;
        }
    </style>
</head>
<body>
{{body}}
</body>
</html>
