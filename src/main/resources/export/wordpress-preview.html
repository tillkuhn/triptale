<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <!-- A rough stand-in for the blog theme: the real look comes from WordPress -->
    <style>
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: #fff;
            color: #1a1a2e;
            max-width: 760px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }
        h1, h2, h3, h4 {
            font-family: sans-serif;
        }
        .wp-block-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 1rem 0;
        }
        .wp-block-gallery.columns-1 { grid-template-columns: 1fr; }
        .wp-block-gallery.columns-3 { grid-template-columns: repeat(3, 1fr); }
        .wp-block-gallery.columns-4 { grid-template-columns: repeat(4, 1fr); }
        .wp-block-gallery figure {
            margin: 0;
        }
        .wp-block-gallery img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }
        .wp-block-columns {
            display: flex;
            gap: 1rem;
            margin: 0.5rem 0 1.5rem;
        }
        .wp-block-column {
            flex: 1 1 0;
        }
        .wp-block-column p {
            margin: 0.1rem 0;
        }
        @media (max-width: 600px) {
            .wp-block-columns { flex-direction: column; }
        }
        .has-text-align-center { text-align: center; }
        .has-small-font-size { font-size: 0.85rem; }
        .has-x-large-font-size { font-size: 2rem; }
        .wp-block-quote {
            border-left: 4px solid #ccc;
            margin: 1rem 0;
            padding-left: 1rem;
        }
    </style>
</head>
<body>
<h1>{{title}}</h1>
{{body}}
</body>
</html>
