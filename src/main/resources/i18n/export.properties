# Weather (todo 65): WeatherCode bucket labels
weather.clear=clear
weather.partly_cloudy=partly cloudy
weather.cloudy=cloudy
weather.fog=foggy
weather.drizzle=drizzle
weather.rain=rain
weather.snow=snow
weather.thunderstorm=thunderstorm

day=Day
days.one=day
days.other=days
entries.one=entry
