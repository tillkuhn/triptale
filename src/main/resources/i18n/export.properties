# Words the diary exports add around the tales (todo 30). English base: every key must be here.
# Other languages (export_de.properties, ...) may omit keys; those fall back to English.
# Link labels (link.<verb>) default to the domain.LinkKind label and are only listed per language,
# activity labels (activity.<key>) likewise default to the capitalized domain.Activity key.

stats.dates=Dates
stats.distance=Distance
stats.altitude=Altitude
stats.start=Start

day=Day
days.one=day
days.other=days
entries.one=entry
entries.other=entries

# DateTimeFormatter pattern; {ordinal} becomes the day with its suffix (1st, 2nd, 23rd)
date.long=MMMM {ordinal} yyyy
